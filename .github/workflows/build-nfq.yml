name: Build kernel modules for iStoreOS (ipq60xx, kernel 6.12.112)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev rsync swig \
            unzip zlib1g-dev file wget zstd pigz ccache

      - name: 克隆 iStoreOS 源码 (istoreos-25.12)
        run: git clone --depth 1 -b istoreos-25.12 https://github.com/istoreos/istoreos istoreos

      - name: 恢复构建缓存（host 工具 / 工具链 / 内核构建树）
        uses: actions/cache@v4
        with:
          path: |
            istoreos/staging_dir/host*
            istoreos/staging_dir/toolchain-*
            istoreos/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq60xx
          key: istoreos2512-build-v2
          restore-keys: istoreos2512-build-

      - name: 启用 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-istoreos2512-v2
          restore-keys: ccache-istoreos2512-

      - name: 确认内核版本为 6.12.112
        run: grep -E 'LINUX_VERSION-6.12' istoreos/target/linux/generic/kernel-6.12

      - name: 开启所需内核选项并设定编译目标
        run: |
          cd istoreos
          CFG=target/linux/generic/config-6.12
          for opt in \
            CONFIG_NETFILTER_NETLINK_QUEUE \
            CONFIG_NETFILTER_NETLINK_LOG \
            CONFIG_NETFILTER_XT_TARGET_NFQUEUE \
            CONFIG_NETFILTER_XT_TARGET_NFLOG ; do
            sed -i "/^${opt}/d; /^# ${opt} /d" "$CFG"
            echo "${opt}=m" >> "$CFG"
          done
          tail -4 "$CFG"
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_glinet_gl-ax1800=y
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 尝试下载官方预编译工具链（加速，失败则自动构建）
        continue-on-error: true
        run: |
          cd istoreos
          if [ -d "$(ls -d staging_dir/toolchain-* 2>/dev/null | head -1)" ]; then
            echo "已有工具链（来自缓存），跳过下载"; exit 0
          fi
          TC_TAR="openwrt-toolchain-25.12.6-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.openwrt.org/releases/25.12.6/targets/qualcommax/ipq60xx/$TC_TAR"
          wget -q --timeout=180 -O /tmp/tc.tar.zst "$URL" || { echo "下载失败，回退到自动构建"; exit 1; }
          mkdir -p /tmp/tcx && tar --zstd -xf /tmp/tc.tar.zst -C /tmp/tcx || exit 1
          SRC=$(find /tmp/tcx -maxdepth 2 -type d -name 'toolchain-*' | head -1)
          [ -z "$SRC" ] && { echo "包内未找到 toolchain 目录"; exit 1; }
          rm -rf staging_dir/toolchain-*
          cp -a "$SRC" staging_dir/
          TC=$(ls -d staging_dir/toolchain-* | head -1)
          mkdir -p "$TC/stamp"
          touch "$TC/stamp/.toolchain_compiled" "$TC/stamp/.toolchain_installed"
          echo "工具链就位: $TC"

      - name: 构建 host 工具
        run: |
          cd istoreos
          make -j$(nproc) tools/install V=s

      - name: 构建交叉工具链（已就位则跳过）
        run: |
          cd istoreos
          make -j$(nproc) toolchain/install V=s

      - name: 准备内核构建树
        run: |
          cd istoreos
          make -j$(nproc) target/linux/prepare V=s

      - name: 编译内核与全部模块
        run: |
          cd istoreos
          make -j$(nproc) target/linux/compile V=s

      - name: 编译 kmod 安装包
        continue-on-error: true
        run: |
          cd istoreos
          make -j$(nproc) package/kernel/linux/compile V=s

      - name: 收集产物
        run: |
          cd istoreos
          KB=$(find build_dir/target-* -maxdepth 3 -type d -name 'linux-6.12.*' | head -1)
          echo "内核目录: $KB"
          mkdir -p /tmp/out

          # 1) 目标模块：NFQUEUE 相关
          for m in nfnetlink_queue nfnetlink_log xt_NFQUEUE xt_NFLOG; do
            KO=$(find "$KB" -name "$m.ko" | head -1)
            if [ -n "$KO" ]; then cp "$KO" /tmp/out/; echo "已收集: $m.ko"; else echo "缺失: $m.ko"; fi
          done

          # 2) 全部内核模块打包
          find "$KB" -name '*.ko' -exec cp --parents {} /tmp/allko/ \; 2>/dev/null || true
          if [ -d /tmp/allko ]; then
            tar czf /tmp/out/all-kernel-modules.tar.gz -C /tmp/allko .
            echo "全部模块数量: $(find /tmp/allko -name '*.ko' | wc -l)"
          fi

          # 3) kmod 安装包
          if [ -d bin/packages ]; then
            tar czf /tmp/out/kmod-packages.tar.gz -C bin/packages .
            echo "kmod 包数量: $(find bin/packages -name '*.apk' -o -name '*.ipk' | wc -l)"
          else
            echo "(未生成 kmod 包)"
          fi

          ls -lh /tmp/out/

      - name: 上传模块
        uses: actions/upload-artifact@v4
        with:
          name: nfqueue-modules
          path: |
            /tmp/out/nfnetlink_queue.ko
            /tmp/out/nfnetlink_log.ko
            /tmp/out/xt_NFQUEUE.ko
            /tmp/out/xt_NFLOG.ko
          if-no-files-found: warn

      - name: 上传全部模块与 kmod 包
        uses: actions/upload-artifact@v4
        with:
          name: all-kernel-modules
          path: |
            /tmp/out/all-kernel-modules.tar.gz
            /tmp/out/kmod-packages.tar.gz
          if-no-files-found: warn
